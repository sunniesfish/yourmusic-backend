name: Backend Build and Deploy (Firestore)

# Workflow runs when code is pushed to main branch
on:
  push:
    branches: [main]

# Environment variables
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: ${{ secrets.GCP_REPOSITORY }}
  IMAGE_NAME: ${{ secrets.GCP_IMAGE_NAME }}
  SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME }}
  SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  SA_KEY: ${{ secrets.GCP_SA_KEY }}
  SECRET_NAME: ${{ secrets.GCP_ENV_SECRET_NAME }}
  VPC_CONNECTOR: ${{ secrets.GCP_VPC_CONNECTOR }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source code
      - name: Checkout source code
        uses: actions/checkout@v3

      # 2. Set up Google Cloud authentication
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ env.SA_KEY }}

      # 3. Set up Google Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # 4. Configure Docker authentication
      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # 5. Enable Firestore API (if not already enabled)
      - name: Enable Firestore API
        run: |
          gcloud services enable firestore.googleapis.com --project=${{ env.PROJECT_ID }}

      # 6. Verify Firestore database exists
      - name: Verify Firestore database
        run: |
          echo "Checking Firestore database status..."
          gcloud firestore databases describe --database="(default)" --project=${{ env.PROJECT_ID }} || {
            echo "Creating Firestore database in Native mode..."
            gcloud firestore databases create --database="(default)" --location=${{ env.REGION }} --type=firestore-native --project=${{ env.PROJECT_ID }}
          }

      # 7. Configure Firestore IAM permissions
      - name: Configure Firestore IAM permissions
        run: |
          echo "Configuring Firestore permissions for service account..."
          gcloud projects add-iam-policy-binding ${{ env.PROJECT_ID }} \
            --member="serviceAccount:${{ env.SERVICE_ACCOUNT }}" \
            --role="roles/datastore.user"

      # 8. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
                       --build-arg PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true \
                       -f Dockerfile \
                       .

      # 9. Push Docker image to Artifact Registry
      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      # 10. Get latest secret version
      - name: Get latest secret version
        id: get_secret_version
        run: |
          LATEST_SECRET_VERSION=$(gcloud secrets versions list ${{ env.SECRET_NAME }} \
            --sort-by=~createTime --limit=1 --format="value(name)")
          echo "Latest secret version: $LATEST_SECRET_VERSION"
          echo "LATEST_SECRET_VERSION=${LATEST_SECRET_VERSION}" >> $GITHUB_OUTPUT

      # 11. Deploy to Cloud Run with Firestore configuration
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --service-account ${{ env.SERVICE_ACCOUNT }} \
            --set-secrets="/secrets/.env=${{ env.SECRET_NAME }}:${{ steps.get_secret_version.outputs.LATEST_SECRET_VERSION }}" \
            --set-env-vars="GOOGLE_CLOUD_PROJECT_ID=${{ env.PROJECT_ID }}" \
            --set-env-vars="NODE_ENV=production" \
            --memory=1Gi \
            --cpu=1 \
            --max-instances=10 \
            --verbosity=debug

      # 12. Verify Firestore connectivity
      - name: Verify Firestore connectivity
        run: |
          echo "### Verifying Firestore connectivity ###"
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)")

          echo "Service URL: $SERVICE_URL"

          # Wait for service to be ready
          sleep 30

          # Test basic connectivity (adjust endpoint as needed)
          curl -f "$SERVICE_URL/health" || echo "Health check endpoint not available"

      # 13. Check Cloud Run service logs
      - name: Check Cloud Run service logs
        if: always()
        run: |
          echo "### Recent logs ###"
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=${{ env.SERVICE_NAME }}" \
            --limit=50 \
            --format="table(timestamp, severity, textPayload)" \
            --freshness=1h

      # 14. Verify deployment status
      - name: Verify deployment status
        if: always()
        run: |
          echo "### Deployment status ###"
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format="yaml(status)" || true

      # 15. Display Firestore information
      - name: Display Firestore information
        if: always()
        run: |
          echo "### Firestore Database Information ###"
          gcloud firestore databases describe --database="(default)" --project=${{ env.PROJECT_ID }} || true

          echo "### Firestore Collections (if any) ###"
          gcloud firestore collections list --database="(default)" --project=${{ env.PROJECT_ID }} || echo "No collections found or insufficient permissions"
